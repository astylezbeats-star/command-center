<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SpartaAuto360 | Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg-deep:#050810;--bg-mid:#0a0e1a;--bg-card:#0d1424;--cyan:#00f0ff;--magenta:#ff2d7b;--green:#00ff88;--amber:#ff8800;--text-bright:#e0f4ff;--text-dim:#7a9cb8;--text-muted:#3a5068;--grid:rgba(0,240,255,0.05)}
@property --num{syntax:"<integer>";initial-value:0;inherits:false}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg-deep);color:var(--text-bright);min-height:100vh;overflow-x:hidden;position:relative;padding-top:64px;padding-bottom:80px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}

.grid-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.grid-bg::before{content:'';position:absolute;inset:-50%;width:200%;height:200%;background:repeating-linear-gradient(90deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 80px),repeating-linear-gradient(0deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 80px);transform:perspective(500px) rotateX(60deg);transform-origin:center top;animation:gridPulse 4s ease-in-out infinite}
@keyframes gridPulse{0%,100%{opacity:.4}50%{opacity:.7}}
.scanlines{position:fixed;inset:0;z-index:9998;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,0.015) 2px,rgba(0,240,255,0.015) 4px);animation:scanDrift 8s linear infinite}
@keyframes scanDrift{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.particles::before{content:'';position:absolute;width:2px;height:2px;border-radius:50%;box-shadow:100px 50px 0 0 rgba(0,240,255,0.4),300px 150px 0 0 rgba(255,45,123,0.3),500px 80px 0 0 rgba(0,255,136,0.3),700px 200px 0 0 rgba(0,240,255,0.2),150px 300px 0 0 rgba(255,136,0,0.3),900px 100px 0 0 rgba(0,240,255,0.4),250px 400px 0 0 rgba(255,45,123,0.2),600px 350px 0 0 rgba(0,255,136,0.4),800px 400px 0 0 rgba(0,240,255,0.3),400px 250px 0 0 rgba(255,136,0,0.2),50px 200px 0 0 rgba(0,240,255,0.5),750px 300px 0 0 rgba(255,45,123,0.4),1000px 150px 0 0 rgba(0,255,136,0.3),1100px 350px 0 0 rgba(0,240,255,0.2),200px 500px 0 0 rgba(255,136,0,0.4);animation:particleFloat 20s linear infinite}
@keyframes particleFloat{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-20px) translateX(10px)}100%{transform:translateY(0) translateX(0)}}

.top-bar{position:fixed;top:0;left:0;right:0;height:60px;z-index:100;background:linear-gradient(180deg,rgba(10,14,26,0.98),rgba(10,14,26,0.9));border-bottom:1px solid rgba(0,240,255,0.15);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.logo-area{display:flex;align-items:center;gap:12px}
.hex-logo{width:36px;height:36px;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background:linear-gradient(135deg,var(--cyan),var(--magenta));font-family:'Orbitron',monospace;font-weight:900;font-size:16px;color:#fff}
.brand{display:flex;flex-direction:column}.brand-name{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,0.5);letter-spacing:2px}.brand-sub{font-size:10px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase}
.status-area{display:flex;align-items:center;gap:16px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(0.85)}}
.clock{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim)}.clock-date{font-size:10px;color:var(--text-muted);text-align:right}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;z-index:100;background:linear-gradient(0deg,rgba(5,8,16,0.98),rgba(10,14,26,0.95));border-top:1px solid rgba(0,240,255,0.15);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 14px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:8px;transition:all .3s;position:relative;font-size:10px;font-family:'Inter',sans-serif}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-btn.active{color:var(--cyan)}.nav-btn.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);border-radius:2px}
.nav-btn:hover{color:var(--text-bright);background:rgba(0,240,255,0.05)}

.hud-card{position:relative;background:var(--bg-card);border:1px solid rgba(0,240,255,0.1);padding:20px;margin-bottom:16px;transition:transform .3s,box-shadow .3s}
.hud-card:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,240,255,0.1)}
.hud-card::before,.hud-card::after{content:'';position:absolute;width:12px;height:12px;border-color:var(--cyan);border-style:solid}
.hud-card::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.hud-card::after{top:-1px;right:-1px;border-width:2px 2px 0 0}
.card-title{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase}
.corner-bl{position:absolute;bottom:-1px;left:-1px;width:12px;height:12px;border-style:solid;border-color:var(--cyan);border-width:0 0 2px 2px}
.corner-br{position:absolute;bottom:-1px;right:-1px;width:12px;height:12px;border-style:solid;border-color:var(--cyan);border-width:0 2px 2px 0}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi-value{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--text-bright)}
.kpi-label{font-size:11px;color:var(--text-muted);margin-top:4px;letter-spacing:1px}
.kpi-change{display:inline-flex;align-items:center;gap:4px;font-size:11px;margin-top:6px;padding:2px 8px;border-radius:4px}
.kpi-change.up{color:var(--green);background:rgba(0,255,136,0.1)}.kpi-change.down{color:var(--magenta);background:rgba(255,45,123,0.1)}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:24px}
.bar-chart{display:flex;align-items:flex-end;justify-content:space-around;height:160px;padding-top:20px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.bar{width:24px;border-radius:4px 4px 0 0;background:linear-gradient(0deg,var(--cyan),rgba(0,240,255,0.6));box-shadow:0 0 10px rgba(0,240,255,0.3);transition:height 1.5s cubic-bezier(0.4,0,0.2,1)}
.bar-label{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}
.line-path{fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine 2s ease forwards 0.5s}
@keyframes drawLine{to{stroke-dashoffset:0}}
.line-area{opacity:0;animation:fadeIn 1s ease forwards 2s}@keyframes fadeIn{to{opacity:1}}
.donut-ring{fill:none;stroke-width:8;stroke-linecap:round}
.flow-container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 0}
.flow-node{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 16px;border:1px solid rgba(0,240,255,0.3);background:rgba(0,240,255,0.05);border-radius:4px;min-width:70px}
.flow-node-label{font-size:10px;color:var(--text-dim);font-family:'Orbitron',monospace;letter-spacing:1px}
.flow-node-value{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--cyan)}
.flow-arrow{width:30px;height:2px;background:linear-gradient(90deg,var(--cyan),transparent);position:relative;animation:flowPulse 2s ease-in-out infinite}
.flow-arrow::after{content:'';position:absolute;right:0;top:-3px;border:4px solid transparent;border-left:6px solid var(--cyan)}
@keyframes flowPulse{0%,100%{opacity:.4}50%{opacity:1}}
.ring-progress{position:relative;width:44px;height:44px}.ring-progress svg{transform:rotate(-90deg)}
.ring-progress circle{fill:none;stroke-width:3}.ring-bg{stroke:rgba(0,240,255,0.1)}.ring-fill{stroke:var(--cyan);stroke-linecap:round;transition:stroke-dashoffset 1.5s ease}

.hud-table{width:100%;border-collapse:collapse;font-size:13px}
.hud-table th{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:1px;color:var(--text-muted);text-align:left;padding:10px 12px;border-bottom:1px solid rgba(0,240,255,0.1)}
.hud-table td{padding:10px 12px;border-bottom:1px solid rgba(0,240,255,0.05);color:var(--text-dim)}
.hud-table tr:hover td{background:rgba(0,240,255,0.03);color:var(--text-bright)}
.status-chip{display:inline-block;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:0.5px}
.status-new{background:rgba(0,240,255,0.15);color:var(--cyan);border:1px solid rgba(0,240,255,0.3)}
.status-contacted{background:rgba(255,136,0,0.15);color:var(--amber);border:1px solid rgba(255,136,0,0.3)}
.status-won{background:rgba(0,255,136,0.15);color:var(--green);border:1px solid rgba(0,255,136,0.3)}
.status-lost{background:rgba(255,45,123,0.15);color:var(--magenta);border:1px solid rgba(255,45,123,0.3)}
.status-quoted{background:rgba(138,43,226,0.15);color:#b366ff;border:1px solid rgba(138,43,226,0.3)}
.status-booked{background:rgba(0,200,255,0.2);color:#66ddff;border:1px solid rgba(0,200,255,0.4)}

.modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(5,8,16,0.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-mid);border:1px solid rgba(0,240,255,0.2);padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative}
.modal::before,.modal::after{content:'';position:absolute;width:16px;height:16px;border-color:var(--cyan);border-style:solid}
.modal::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.modal::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.modal h3{font-family:'Orbitron',monospace;font-size:14px;color:var(--cyan);margin-bottom:20px;letter-spacing:2px}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px;letter-spacing:1px;font-family:'Orbitron',monospace}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:rgba(0,240,255,0.03);border:1px solid rgba(0,240,255,0.15);color:var(--text-bright);font-family:'Inter',sans-serif;font-size:13px;border-radius:4px;outline:none;transition:border-color .3s}
.form-group input:focus,.form-group select:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,0.2)}
.btn{padding:10px 20px;border:1px solid;border-radius:4px;cursor:pointer;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:1px;transition:all .3s;background:transparent}
.btn-cyan{border-color:var(--cyan);color:var(--cyan)}.btn-cyan:hover{background:rgba(0,240,255,0.15);box-shadow:0 0 15px rgba(0,240,255,0.3)}
.btn-magenta{border-color:var(--magenta);color:var(--magenta)}.btn-magenta:hover{background:rgba(255,45,123,0.15)}
.btn-green{border-color:var(--green);color:var(--green)}.btn-green:hover{background:rgba(0,255,136,0.15)}
.btn-sm{padding:6px 12px;font-size:10px}
.feed-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,240,255,0.05)}
.feed-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.feed-text{font-size:12px;color:var(--text-dim)}.feed-time{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.chat-container{display:flex;flex-direction:column;height:400px}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-bubble{max-width:80%;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.5}
.chat-bubble.ai{background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.15);align-self:flex-start;color:var(--text-dim)}
.chat-bubble.user{background:rgba(255,45,123,0.08);border:1px solid rgba(255,45,123,0.15);align-self:flex-end;color:var(--text-dim)}
.chat-input-area{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(0,240,255,0.1)}
.chat-input-area input{flex:1;padding:10px;background:rgba(0,240,255,0.03);border:1px solid rgba(0,240,255,0.15);color:var(--text-bright);border-radius:4px;font-size:13px;outline:none}
.schedule-item{display:flex;gap:16px;padding:14px;margin-bottom:10px;border:1px solid rgba(0,240,255,0.08);background:rgba(0,240,255,0.02)}
.schedule-time{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cyan);min-width:60px}
.schedule-info{flex:1}.schedule-info h4{font-size:13px;color:var(--text-bright);margin-bottom:4px}.schedule-info p{font-size:11px;color:var(--text-muted)}
.content-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.content-card{border:1px solid rgba(0,240,255,0.08);padding:16px;background:rgba(0,240,255,0.02)}
.content-card h4{font-size:13px;margin-bottom:8px;color:var(--text-bright)}.content-card p{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:10px}
.platform-tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:9px;font-weight:600;margin-right:4px}
.settings-group{margin-bottom:24px;padding:20px;border:1px solid rgba(0,240,255,0.08);background:rgba(0,240,255,0.02)}
.settings-group h4{font-family:'Orbitron',monospace;font-size:12px;color:var(--cyan);margin-bottom:16px;letter-spacing:1px}
.color-options{display:flex;gap:10px;margin-top:8px}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .3s}
.color-opt.active,.color-opt:hover{border-color:#fff;transform:scale(1.1)}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:10px 14px;background:rgba(0,240,255,0.03);border:1px solid rgba(0,240,255,0.12);color:var(--text-bright);border-radius:4px;font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--cyan)}
.search-bar select{padding:10px;background:var(--bg-card);border:1px solid rgba(0,240,255,0.12);color:var(--text-dim);border-radius:4px;font-size:12px;outline:none}
.toggle-group{display:flex;gap:8px;margin-bottom:16px}.toggle-btn{padding:8px 16px;border:1px solid rgba(0,240,255,0.2);background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;border-radius:4px;transition:all .3s}
.toggle-btn.active{background:rgba(0,240,255,0.15);color:var(--cyan);border-color:var(--cyan)}
.quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick-action{padding:8px 14px;border:1px solid rgba(0,240,255,0.2);border-radius:20px;font-size:11px;color:var(--text-dim);cursor:pointer;transition:all .3s}
.quick-action:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,240,255,0.05)}
.sparkline{display:flex;align-items:flex-end;gap:2px;height:30px}.sparkline .spark-bar{width:4px;border-radius:2px;background:var(--cyan);opacity:.6;animation:sparkRise 1s ease forwards}
@keyframes sparkRise{from{height:0}}
.voice-metric{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid rgba(0,240,255,0.06);margin-bottom:8px}
.voice-metric .vm-label{font-size:11px;color:var(--text-muted);flex:1}.voice-metric .vm-value{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--text-bright)}
/* Media Player */
.media-player{position:relative;width:100%;background:#000;border-radius:4px;overflow:hidden;aspect-ratio:16/9;border:1px solid rgba(0,240,255,0.2)}
.media-player video{width:100%;height:100%;object-fit:contain;display:block}
.media-player .no-video{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-muted);font-family:'Orbitron',monospace;font-size:12px;letter-spacing:2px}
.media-controls{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(10,14,26,0.95);border:1px solid rgba(0,240,255,0.1);border-top:none;border-radius:0 0 4px 4px;flex-wrap:wrap}
.media-controls button{padding:6px 14px;border:1px solid rgba(0,240,255,0.3);background:rgba(0,240,255,0.05);color:var(--cyan);font-family:'Orbitron',monospace;font-size:10px;letter-spacing:1px;cursor:pointer;border-radius:4px;transition:all .2s}
.media-controls button:hover{background:rgba(0,240,255,0.15);box-shadow:0 0 10px rgba(0,240,255,0.3)}
.media-controls button.active{background:rgba(0,240,255,0.2);box-shadow:0 0 8px rgba(0,240,255,0.4)}
.media-controls button.muted{border-color:var(--magenta);color:var(--magenta);background:rgba(255,45,123,0.1)}
.media-controls button.muted:hover{background:rgba(255,45,123,0.2)}
.media-controls .vol-slider{width:80px;accent-color:var(--cyan);cursor:pointer}
.media-controls .track-name{font-size:11px;color:var(--text-dim);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop-zone{border:2px dashed rgba(0,240,255,0.3);border-radius:4px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .3s;background:rgba(0,240,255,0.02)}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--cyan);background:rgba(0,240,255,0.08);box-shadow:0 0 20px rgba(0,240,255,0.1)}
.drop-zone h4{font-family:'Orbitron',monospace;font-size:11px;color:var(--cyan);margin-bottom:6px;letter-spacing:1px}
.drop-zone p{font-size:11px;color:var(--text-muted)}
.media-list{max-height:200px;overflow-y:auto;margin-top:10px}
.media-list-item{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid rgba(0,240,255,0.06);margin-bottom:4px;cursor:pointer;transition:all .2s;font-size:12px;color:var(--text-dim)}
.media-list-item:hover{background:rgba(0,240,255,0.05);border-color:rgba(0,240,255,0.2);color:var(--text-bright)}
.media-list-item.active{border-color:var(--cyan);background:rgba(0,240,255,0.1);color:var(--cyan)}
.media-list-item .item-icon{width:20px;height:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.media-list-item .item-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.music-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(255,45,123,0.05);border:1px solid rgba(255,45,123,0.15);border-radius:4px;margin-top:10px}
.music-bar .eq-bars{display:flex;gap:2px;align-items:flex-end;height:16px}
.music-bar .eq-bar{width:3px;background:var(--magenta);border-radius:1px;animation:eqBounce 0.8s ease-in-out infinite alternate}
.music-bar .eq-bar:nth-child(1){height:8px;animation-delay:0s}
.music-bar .eq-bar:nth-child(2){height:14px;animation-delay:0.15s}
.music-bar .eq-bar:nth-child(3){height:6px;animation-delay:0.3s}
.music-bar .eq-bar:nth-child(4){height:12px;animation-delay:0.1s}
.music-bar .eq-bar:nth-child(5){height:10px;animation-delay:0.25s}
@keyframes eqBounce{0%{transform:scaleY(0.4)}100%{transform:scaleY(1)}}
.music-bar.paused .eq-bar{animation-play-state:paused}
@media(max-width:768px){.kpi-grid{grid-template-columns:1fr 1fr}.chart-grid{grid-template-columns:1fr}.flow-container{flex-direction:column}.hud-table{font-size:11px}.nav-btn{padding:8px 8px;font-size:9px}.top-bar{padding:0 12px}.brand-name{font-size:11px}}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr}.nav-btn span{display:none}}
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="scanlines"></div>
<div class="particles"></div>

<header class="top-bar">
<div class="logo-area">
<div class="hex-logo">S</div>

{id:5,name:"Carlos Mendez",contact:"(720) 555-0143",service:"Rim & Tire Package",value:2400,status:"contacted",vehicle:"2023 Chevy Silverado",date:"2024-01-12"},
{id:6,name:"Hannah Brooks",contact:"hannah.b@email.com",service:"Ceramic Tint",value:650,status:"new",vehicle:"2024 Audi Q5",date:"2024-01-12"},
{id:7,name:"Devon Marshall",contact:"(303) 555-0167",service:"Full PPF + Tint",value:5800,status:"won",vehicle:"2024 Porsche 911",date:"2024-01-11"},

{id:2,date:getRelativeDate(1),time:"14:00",client:"Dana Chen",service:"Window Tint",vehicle:"2023 BMW X5",duration:"2h"},
{id:3,date:getRelativeDate(2),time:"10:00",client:"Hannah Brooks",service:"Ceramic Tint",vehicle:"2024 Audi Q5",duration:"2.5h"}

function getRelativeDate(daysFromNow){const d=new Date();d.setDate(d.getDate()+daysFromNow);return d.toISOString().split('T')[0]}

let leads = JSON.parse(localStorage.getItem('az_leads')) || [...DEFAULT_LEADS];
let appointments = JSON.parse(localStorage.getItem('az_appts')) || [...DEFAULT_APPTS];

{role:'ai',text:'Welcome to the SpartaAuto360 AI Assistant. I can help you manage leads, schedule appointments, and provide business insights. What would you like to do?'}
];
let currentTab = 'home';

function saveData(){
localStorage.setItem('az_leads',JSON.stringify(leads));
localStorage.setItem('az_appts',JSON.stringify(appointments));
localStorage.setItem('az_chat',JSON.stringify(chatHistory));
}

// ===== CLOCK =====
function updateClock(){
const now=new Date();
document.getElementById('clock').textContent=now.toLocaleTimeString('en-US',{hour12:false});
document.getElementById('clockDate').textContent=now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
setInterval(updateClock,1000);updateClock();

// ===== NAV =====
const TABS=[
{id:'home',label:'Home',icon:'<path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0h4"/>'},
{id:'leads',label:'Leads',icon:'<path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>'},
{id:'schedule',label:'Schedule',icon:'<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>'},
{id:'voice',label:'Voice',icon:'<path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>'},

{id:'content',label:'Content',icon:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>'},
{id:'ai',label:'AI',icon:'<path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>'},
{id:'media',label:'Media',icon:'<polygon points="5 3 19 12 5 21 5 3"/><line x1="19" y1="3" x2="19" y2="21"/>'},
{id:'setup',label:'Setup',icon:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>'}
];

function renderNav(){
const nav=document.getElementById('bottomNav');
nav.innerHTML=TABS.map(t=>`<button class="nav-btn ${currentTab===t.id?'active':''}" onclick="switchTab('${t.id}')"><svg viewBox="0 0 24 24">${t.icon}</svg><span>${t.label}</span></button>`).join('');
}

function switchTab(tab){currentTab=tab;renderNav();renderContent();}

// ===== MODAL =====
function openModal(html){document.getElementById('modalContent').innerHTML=html;document.getElementById('modalOverlay').classList.add('show');}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}

// ===== COUNTER ANIMATION =====
function animateCounters(){
document.querySelectorAll('[data-count]').forEach(el=>{
const target=parseInt(el.dataset.count);const prefix=el.dataset.prefix||'';const suffix=el.dataset.suffix||'';
let current=0;const step=Math.ceil(target/60);const interval=setInterval(()=>{current+=step;if(current>=target){current=target;clearInterval(interval)}el.textContent=prefix+current.toLocaleString()+suffix;},25);
});}

// ===== RENDER CONTENT =====
function renderContent(){
const main=document.getElementById('mainContent');
switch(currentTab){
case 'home': main.innerHTML=renderHome();break;
case 'leads': main.innerHTML=renderLeads();break;
case 'schedule': main.innerHTML=renderSchedule();break;
case 'voice': main.innerHTML=renderVoice();break;
case 'messages': main.innerHTML=renderMessages();break;
case 'content': main.innerHTML=renderContentStudio();break;
case 'ai': main.innerHTML=renderAI();break;
case 'media': main.innerHTML=renderMedia();break;
case 'setup': main.innerHTML=renderSetup();break;
}
setTimeout(()=>{animateCounters();animateBars();animateRings();if(currentTab==='media')initMediaDropZones();},100);
}

function animateBars(){document.querySelectorAll('.bar[data-h]').forEach((b,i)=>{setTimeout(()=>{b.style.height=b.dataset.h+'px';},i*100);})}
function animateRings(){document.querySelectorAll('.ring-fill[data-offset]').forEach(r=>{setTimeout(()=>{r.style.strokeDashoffset=r.dataset.offset;},300);})}

// ===== HOME TAB =====
function renderHome(){
const totalLeads=leads.length;const newThisWeek=leads.filter(l=>l.status==='new').length;
const revenue=leads.filter(l=>l.status==='won').reduce((s,l)=>s+l.value,0);
const convRate=totalLeads?Math.round((leads.filter(l=>l.status==='won').length/totalLeads)*100):0;
const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const barData=[5,8,3,7,6,4,9];
const maxBar=Math.max(...barData);

// Service breakdown
const services={Tint:0,PPF:0,Wrap:0,Correction:0,Rims:0};
leads.forEach(l=>{
if(l.service.toLowerCase().includes('tint'))services.Tint++;
else if(l.service.toLowerCase().includes('ppf'))services.PPF++;
else if(l.service.toLowerCase().includes('wrap'))services.Wrap++;
else if(l.service.toLowerCase().includes('correction'))services.Correction++;
else if(l.service.toLowerCase().includes('rim'))services.Rims++;
});
const svcTotal=Object.values(services).reduce((a,b)=>a+b,1);
const svcColors=['var(--cyan)','var(--magenta)','var(--green)','var(--amber)','#b366ff'];

// Flow data
const flowStages=[
{label:'NEW',count:leads.filter(l=>l.status==='new').length},
{label:'CONTACTED',count:leads.filter(l=>l.status==='contacted').length},
{label:'QUOTED',count:leads.filter(l=>l.status==='quoted').length},
{label:'BOOKED',count:leads.filter(l=>l.status==='booked').length},
{label:'WON',count:leads.filter(l=>l.status==='won').length}
];

// Line chart data (14 days revenue trend)
const lineData=[1200,1800,900,2400,1600,3200,2800,1900,4200,3600,2100,4800,3900,5200];
const lineMax=Math.max(...lineData);
const linePoints=lineData.map((v,i)=>`${i*(280/13)},${140-((v/lineMax)*120)}`).join(' ');

return `
<div class="kpi-grid">
  <div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="card-title">Total Leads</div>
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="kpi-value" data-count="${totalLeads}">${totalLeads}</div>
      <div class="ring-progress"><svg width="44" height="44"><circle class="ring-bg" cx="22" cy="22" r="18"/><circle class="ring-fill" cx="22" cy="22" r="18" stroke-dasharray="113" stroke-dashoffset="113" data-offset="${113-(totalLeads/1000)*113}"/></svg></div>
    </div>
    <div class="kpi-label">LIFETIME TOTAL</div>
  </div>
  <div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="card-title">New This Week</div>
    <div class="kpi-value" data-count="${newThisWeek}">${newThisWeek}</div>
    <div class="kpi-label">FRESH LEADS</div>
    <div class="kpi-change up">&#9650; 12%</div>
  </div>
  <div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="card-title">Revenue (Won)</div>
    <div class="kpi-value" data-count="${revenue}" data-prefix="$">${revenue}</div>
    <div class="kpi-label">CLOSED DEALS</div>
    <div class="kpi-change up">&#9650; 24%</div>
  </div>
  <div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="card-title">Conversion Rate</div>
    <div style="display:flex;align-items:center;gap:16px">
      <div class="kpi-value" data-count="${convRate}" data-suffix="%">${convRate}%</div>
      <svg width="60" height="60" viewBox="0 0 60 60">
        <circle cx="30" cy="30" r="24" fill="none" stroke="rgba(0,240,255,0.1)" stroke-width="6"/>
        <circle class="ring-fill" cx="30" cy="30" r="24" fill="none" stroke="var(--green)" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="${2*Math.PI*24}" stroke-dashoffset="${2*Math.PI*24}" data-offset="${2*Math.PI*24*(1-convRate/100)}" style="transform:rotate(-90deg);transform-origin:center"/>
      </svg>
    </div>
    <div class="kpi-label">LEAD TO CLOSE</div>
  </div>
</div>

<div class="chart-grid">
  <div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="card-title">Weekly Lead Activity</div>
    <div class="bar-chart">${barData.map((v,i)=>`<div class="bar-col"><div class="bar" data-h="${(v/maxBar)*130}" style="height:0"></div><div class="bar-label">${days[i]}</div></div>`).join('')}</div>
  </div>
  <div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="card-title">Service Breakdown</div>
    <svg viewBox="0 0 200 200" width="200" height="200" style="display:block;margin:0 auto">
      ${Object.entries(services).map(([name,count],i)=>{
        const pct=count/svcTotal;const circ=2*Math.PI*70;const offset=circ*(1-pct);
        const rotation=Object.entries(services).slice(0,i).reduce((a,[,c])=>a+(c/svcTotal)*360,0);
        return `<circle cx="100" cy="100" r="70" fill="none" stroke="${svcColors[i]}" stroke-width="14" stroke-dasharray="${circ}" stroke-dashoffset="${offset}" style="transform:rotate(${rotation-90}deg);transform-origin:center;opacity:0.8" stroke-linecap="round"/>`;
      }).join('')}
      <text x="100" y="95" text-anchor="middle" fill="var(--text-bright)" font-family="JetBrains Mono" font-size="20" font-weight="700">${svcTotal}</text>
      <text x="100" y="115" text-anchor="middle" fill="var(--text-muted)" font-family="Orbitron" font-size="8" letter-spacing="1">SERVICES</text>
    </svg>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center">${Object.entries(services).map(([name],i)=>`<span style="font-size:10px;color:${svcColors[i]}">&#9679; ${name}</span>`).join('')}</div>
  </div>
</div>

<div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
  <div class="card-title">Lead Pipeline Flow</div>
  <div class="flow-container">
    ${flowStages.map((s,i)=>`<div class="flow-node"><div class="flow-node-label">${s.label}</div><div class="flow-node-value">${s.count}</div></div>${i<flowStages.length-1?'<div class="flow-arrow"></div>':''}`).join('')}
  </div>
</div>

<div class="chart-grid">
  <div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="card-title">Revenue Trend (14 Days)</div>
    <svg viewBox="0 0 300 160" class="svg-chart" style="height:160px">
      <defs><linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(0,240,255,0.3)"/><stop offset="100%" stop-color="rgba(0,240,255,0)"/></linearGradient></defs>
      <polygon class="line-area" points="0,140 ${linePoints} ${280},140" fill="url(#lineGrad)"/>
      <polyline class="line-path" points="${linePoints}"/>
    </svg>
  </div>
  <div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
    <div class="card-title">Recent Activity</div>
    <div class="feed-item"><div class="feed-dot" style="background:var(--green)"></div><div><div class="feed-text">Devon Marshall - Full PPF + Tint closed for $5,800</div><div class="feed-time">2 hours ago</div></div></div>
    <div class="feed-item"><div class="feed-dot" style="background:var(--cyan)"></div><div><div class="feed-text">New lead: Aisha Johnson - Color Change Wrap</div><div class="feed-time">4 hours ago</div></div></div>
    <div class="feed-item"><div class="feed-dot" style="background:var(--amber)"></div><div><div class="feed-text">Follow-up reminder: Carlos Mendez</div><div class="feed-time">6 hours ago</div></div></div>
    <div class="feed-item"><div class="feed-dot" style="background:var(--magenta)"></div><div><div class="feed-text">Appointment scheduled: Dana Chen - Tomorrow 2PM</div><div class="feed-time">8 hours ago</div></div></div>
  </div>
</div>`;
}

// ===== LEADS TAB =====
function renderLeads(){
return `
<div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <div class="card-title" style="margin:0">Lead Management</div>
    <button class="btn btn-cyan btn-sm" onclick="openLeadModal()">+ NEW LEAD</button>
  </div>
  <div class="search-bar">
    <input type="text" placeholder="Search leads..." id="leadSearch" oninput="filterLeads()">
    <select id="leadFilter" onchange="filterLeads()"><option value="">All Status</option><option value="new">New</option><option value="contacted">Contacted</option><option value="quoted">Quoted</option><option value="booked">Booked</option><option value="won">Won</option><option value="lost">Lost</option></select>
  </div>
  <div style="overflow-x:auto">
  <table class="hud-table">
    <thead><tr><th>NAME</th><th>CONTACT</th><th>SERVICE</th><th>VALUE</th><th>VEHICLE</th><th>STATUS</th><th>ACTIONS</th></tr></thead>
    <tbody id="leadsTableBody">
      ${leads.map(l=>`<tr>
        <td style="color:var(--text-bright);font-weight:500">${l.name}</td>
        <td style="font-family:'JetBrains Mono',monospace;font-size:11px">${l.contact}</td>
        <td>${l.service}</td>
        <td style="font-family:'JetBrains Mono',monospace;color:var(--green)">$${l.value.toLocaleString()}</td>
        <td style="font-size:11px">${l.vehicle}</td>
        <td><span class="status-chip status-${l.status}">${l.status.toUpperCase()}</span></td>
        <td><button class="btn btn-cyan btn-sm" onclick="openLeadModal(${l.id})" style="margin-right:4px">Edit</button><button class="btn btn-magenta btn-sm" onclick="deleteLead(${l.id})">Del</button></td>
      </tr>`).join('')}
    </tbody>
  </table>
  </div>
</div>`;
}

function filterLeads(){
const q=document.getElementById('leadSearch').value.toLowerCase();
const f=document.getElementById('leadFilter').value;
const rows=document.getElementById('leadsTableBody').querySelectorAll('tr');
leads.forEach((l,i)=>{
const matchQ=l.name.toLowerCase().includes(q)||l.service.toLowerCase().includes(q)||l.vehicle.toLowerCase().includes(q);
const matchF=!f||l.status===f;
if(rows[i])rows[i].style.display=(matchQ&&matchF)?'':'none';
});
}

function openLeadModal(id){
const lead=id?leads.find(l=>l.id===id):null;
openModal(`
<h3>${lead?'EDIT':'NEW'} LEAD</h3>
<div class="form-group"><label>Name</label><input id="mName" value="${lead?lead.name:''}"></div>
<div class="form-group"><label>Contact</label><input id="mContact" value="${lead?lead.contact:''}"></div>
<div class="form-group"><label>Service</label><select id="mService">
  <option ${lead&&lead.service==='Full PPF'?'selected':''}>Full PPF</option>
  <option ${lead&&lead.service==='Window Tint'?'selected':''}>Window Tint</option>
  <option ${lead&&lead.service==='Ceramic Tint'?'selected':''}>Ceramic Tint</option>
  <option ${lead&&lead.service==='Vinyl Wrap'?'selected':''}>Vinyl Wrap</option>
  <option ${lead&&lead.service==='Color Change Wrap'?'selected':''}>Color Change Wrap</option>
  <option ${lead&&lead.service==='Paint Correction'?'selected':''}>Paint Correction</option>
  <option ${lead&&lead.service==='Rim & Tire Package'?'selected':''}>Rim & Tire Package</option>
  <option ${lead&&lead.service==='Full PPF + Tint'?'selected':''}>Full PPF + Tint</option>
</select></div>
<div class="form-group"><label>Value ($)</label><input type="number" id="mValue" value="${lead?lead.value:''}"></div>
<div class="form-group"><label>Vehicle</label><input id="mVehicle" value="${lead?lead.vehicle:''}"></div>
<div class="form-group"><label>Status</label><select id="mStatus">
  <option value="new" ${lead&&lead.status==='new'?'selected':''}>New</option>
  <option value="contacted" ${lead&&lead.status==='contacted'?'selected':''}>Contacted</option>
  <option value="quoted" ${lead&&lead.status==='quoted'?'selected':''}>Quoted</option>
  <option value="booked" ${lead&&lead.status==='booked'?'selected':''}>Booked</option>
  <option value="won" ${lead&&lead.status==='won'?'selected':''}>Won</option>
  <option value="lost" ${lead&&lead.status==='lost'?'selected':''}>Lost</option>
</select></div>
<div style="display:flex;gap:10px;margin-top:20px">
  <button class="btn btn-cyan" onclick="saveLead(${id||0})">SAVE</button>
  <button class="btn btn-magenta" onclick="closeModal()">CANCEL</button>
</div>`);
}

function saveLead(id){
const data={
name:document.getElementById('mName').value,
contact:document.getElementById('mContact').value,
service:document.getElementById('mService').value,
value:parseInt(document.getElementById('mValue').value)||0,
vehicle:document.getElementById('mVehicle').value,
status:document.getElementById('mStatus').value,
date:new Date().toISOString().split('T')[0]
};
if(!data.name){alert('Name required');return;}
if(id){const idx=leads.findIndex(l=>l.id===id);if(idx>-1){leads[idx]={...leads[idx],...data};}}
else{data.id=Date.now();leads.unshift(data);}
saveData();closeModal();renderContent();
}

function deleteLead(id){if(confirm('Delete this lead?')){leads=leads.filter(l=>l.id!==id);saveData();renderContent();}}

// ===== SCHEDULE TAB =====
function renderSchedule(){
const today=new Date().toISOString().split('T')[0];
const sortedAppts=[...appointments].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
const grouped={};
sortedAppts.forEach(a=>{if(!grouped[a.date])grouped[a.date]=[];grouped[a.date].push(a);});

return `
<div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <div class="card-title" style="margin:0">Appointments</div>
    <button class="btn btn-cyan btn-sm" onclick="openApptModal()">+ NEW APPOINTMENT</button>
  </div>
  ${Object.entries(grouped).map(([date,appts])=>{
    const d=new Date(date+'T12:00:00');const isToday=date===today;
    const dateLabel=isToday?'TODAY':d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
    return `<div style="margin-bottom:20px">
      <div style="font-family:'Orbitron',monospace;font-size:11px;color:${isToday?'var(--cyan)':'var(--text-muted)'};margin-bottom:10px;letter-spacing:2px;${isToday?'text-shadow:0 0 10px rgba(0,240,255,0.5)':''}">${dateLabel}</div>
      ${appts.map(a=>`<div class="schedule-item">
        <div class="schedule-time">${a.time}</div>

function sendChat(){
const input=document.getElementById('chatInput');
const text=input.value.trim();if(!text)return;
chatHistory.push({role:'user',text});
input.value='';
// AI response
const response=generateAIResponse(text);
chatHistory.push({role:'ai',text:response});
saveData();
const msgs=document.getElementById('chatMessages');
msgs.innerHTML+=`<div class="chat-bubble user">${text}</div><div class="chat-bubble ai">${response}</div>`;
msgs.scrollTop=msgs.scrollHeight;
}

function aiQuick(type){
const queries={
summary:`Here's your daily summary:\n- ${leads.filter(l=>l.status==='new').length} new leads pending\n- ${appointments.length} appointments scheduled\n- $${leads.filter(l=>l.status==='won').reduce((s,l)=>s+l.value,0).toLocaleString()} total revenue from won deals\n- Top service: ${getMostPopularService()}`,
followups:`Follow-up needed:\n${leads.filter(l=>l.status==='contacted').map(l=>'- '+l.name+' ('+l.service+')').join('\n')||'No pending follow-ups!'}`,
revenue:`Revenue breakdown:\n- Won deals: $${leads.filter(l=>l.status==='won').reduce((s,l)=>s+l.value,0).toLocaleString()}\n- Pipeline value: $${leads.filter(l=>l.status!=='won'&&l.status!=='lost').reduce((s,l)=>s+l.value,0).toLocaleString()}\n- Avg deal size: $${Math.round(leads.reduce((s,l)=>s+l.value,0)/leads.length).toLocaleString()}`,
schedule:`Upcoming appointments:\n${appointments.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(a=>'- '+a.date+' '+a.time+': '+a.client+' ('+a.service+')').join('\n')||'No appointments scheduled'}`
};
chatHistory.push({role:'ai',text:queries[type]});
saveData();renderContent();
setTimeout(()=>{const msgs=document.getElementById('chatMessages');if(msgs)msgs.scrollTop=msgs.scrollHeight;},100);
}

function generateAIResponse(text){
const lower=text.toLowerCase();
if(lower.includes('lead')||lower.includes('new'))return `You currently have ${leads.filter(l=>l.status==='new').length} new leads waiting for contact. The highest value is ${leads.sort((a,b)=>b.value-a.value)[0]?.name} at $${leads.sort((a,b)=>b.value-a.value)[0]?.value.toLocaleString()}.`;
if(lower.includes('revenue')||lower.includes('money')||lower.includes('sales'))return `Total revenue from won deals: $${leads.filter(l=>l.status==='won').reduce((s,l)=>s+l.value,0).toLocaleString()}. Your pipeline has $${leads.filter(l=>l.status!=='won'&&l.status!=='lost').reduce((s,l)=>s+l.value,0).toLocaleString()} in potential revenue.`;
if(lower.includes('schedule')||lower.includes('appointment'))return `You have ${appointments.length} appointments coming up. Next one: ${appointments[0]?.client||'None'} - ${appointments[0]?.service||'N/A'}.`;
if(lower.includes('service')||lower.includes('popular'))return `Most requested service: ${getMostPopularService()}. PPF and wraps generate the highest revenue per job.`;
return `I can help you with lead management, scheduling, revenue reports, and business insights. Try asking about your leads, revenue, or upcoming appointments!`;
}

function getMostPopularService(){
const counts={};leads.forEach(l=>{counts[l.service]=(counts[l.service]||0)+1;});
return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'N/A';
}

// After render, set up drag and drop
function initMediaDropZones(){
const vdz=document.getElementById('videoDropZone');
const mdz=document.getElementById('musicDropZone');
if(!vdz||!mdz)return;
[vdz,mdz].forEach(dz=>{
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
});
vdz.addEventListener('drop',e=>{e.preventDefault();vdz.classList.remove('dragover');handleVideoFiles(e.dataTransfer.files);});
mdz.addEventListener('drop',e=>{e.preventDefault();mdz.classList.remove('dragover');handleMusicFiles(e.dataTransfer.files);});
// Load current video if exists
if(mediaVideos.length){
const vid=document.getElementById('mainVideo');
if(vid){vid.src=mediaVideos[currentVideoIdx].url;document.getElementById('noVideoMsg').style.display='none';}
}
}

function handleVideoFiles(files){
Array.from(files).forEach(file=>{
if(!file.type.startsWith('video/'))return;
const url=URL.createObjectURL(file);
mediaVideos.push({name:file.name,url:url,blob:null});
});
saveMediaState();renderContent();
setTimeout(()=>{initMediaDropZones();if(mediaVideos.length===1)playVideoAt(0);},50);
}

function handleMusicFiles(files){
Array.from(files).forEach(file=>{
if(!file.type.startsWith('audio/'))return;
const url=URL.createObjectURL(file);
mediaMusic.push({name:file.name,url:url});
});
saveMediaState();renderContent();
setTimeout(initMediaDropZones,50);
}

function saveMediaState(){
// Note: blob URLs don't persist across sessions, but we save names for display
localStorage.setItem('az_videos',JSON.stringify(mediaVideos.map(v=>({name:v.name,url:v.url}))));
localStorage.setItem('az_music',JSON.stringify(mediaMusic.map(m=>({name:m.name,url:m.url}))));
}

function playVideoAt(idx){
currentVideoIdx=idx;
const vid=document.getElementById('mainVideo');
if(vid&&mediaVideos[idx]){
vid.src=mediaVideos[idx].url;
vid.muted=videoMuted;
vid.play().catch(()=>{});
document.getElementById('noVideoMsg').style.display='none';
document.getElementById('playBtn').textContent='PAUSE';
}
renderContent();setTimeout(initMediaDropZones,50);
}

function playPauseVideo(){
const vid=document.getElementById('mainVideo');
if(!vid||!vid.src)return;
if(vid.paused){vid.play();document.getElementById('playBtn').textContent='PAUSE';}
else{vid.pause();document.getElementById('playBtn').textContent='PLAY';}
}

function prevVideo(){
if(mediaVideos.length===0)return;
currentVideoIdx=(currentVideoIdx-1+mediaVideos.length)%mediaVideos.length;
playVideoAt(currentVideoIdx);
}

function nextVideo(){
if(mediaVideos.length===0)return;
currentVideoIdx=(currentVideoIdx+1)%mediaVideos.length;
playVideoAt(currentVideoIdx);
}

function toggleVideoMute(){
videoMuted=!videoMuted;
const vid=document.getElementById('mainVideo');
if(vid)vid.muted=videoMuted;
const btn=document.getElementById('vidMuteBtn');
if(btn){btn.textContent='VID '+(videoMuted?'MUTED':'AUDIO');btn.classList.toggle('muted',videoMuted);}
}

function toggleMusicMute(){
musicMuted=!musicMuted;
if(bgAudio)bgAudio.muted=musicMuted;
const btn=document.getElementById('musMuteBtn');
if(btn){btn.textContent='BG '+(musicMuted?'MUTED':'MUSIC');btn.classList.toggle('muted',musicMuted);}
}

function setMusicVolume(val){
if(bgAudio)bgAudio.volume=val/100;
}

function playMusicTrack(idx){
if(!mediaMusic[idx])return;
if(!bgAudio){bgAudio=new Audio();bgAudio.loop=true;}
bgAudio.src=mediaMusic[idx].url;
bgAudio.muted=musicMuted;
bgAudio.volume=0.8;
bgAudio.play().catch(()=>{});
musicPlaying=true;
const nameEl=document.getElementById('currentTrackName');
if(nameEl)nameEl.textContent=mediaMusic[idx].name;
const bar=document.getElementById('musicBar');
if(bar){bar.style.display='';bar.classList.remove('paused');}
const statusEl=document.getElementById('musicStatus');
if(statusEl)statusEl.textContent='Playing';
const toggleEl=document.getElementById('bgMusicToggle');
if(toggleEl)toggleEl.textContent='PAUSE';
}

function toggleBGMusic(){
if(!bgAudio||!bgAudio.src)return;
if(bgAudio.paused){bgAudio.play();musicPlaying=true;}
else{bgAudio.pause();musicPlaying=false;}
const bar=document.getElementById('musicBar');
if(bar)bar.classList.toggle('paused',!musicPlaying);
const statusEl=document.getElementById('musicStatus');
if(statusEl)statusEl.textContent=musicPlaying?'Playing':'Paused';
const toggleEl=document.getElementById('bgMusicToggle');
if(toggleEl)toggleEl.textContent=musicPlaying?'PAUSE':'PLAY';
}

function removeVideo(idx){
mediaVideos.splice(idx,1);
if(currentVideoIdx>=mediaVideos.length)currentVideoIdx=0;
saveMediaState();renderContent();setTimeout(initMediaDropZones,50);
}

function removeMusic(idx){
mediaMusic.splice(idx,1);
saveMediaState();renderContent();setTimeout(initMediaDropZones,50);
}

// Hook into renderContent to init drop zones for media tab
const _origRenderContent=renderContent;

// ===== SETUP TAB =====
function renderSetup(){
const biz=JSON.parse(localStorage.getItem('az_business')||'{}');
return `
<div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
  <div class="card-title">Settings & Configuration</div>
</div>
<div class="settings-group">
  <h4>BUSINESS IDENTITY</h4>
  <div class="form-group"><label>Business Name</label><input id="sBizName" value="${biz.name||'SpartaAuto360'}"></div>
  <div class="form-group"><label>Phone</label><input id="sBizPhone" value="${biz.phone||'(720) 555-0100'}"></div>
  <div class="form-group"><label>Email</label><input id="sBizEmail" value="${biz.email||'info@spartaauto360.com'}"></div>
  <div class="form-group"><label>Address</label><input id="sBizAddr" value="${biz.address||'1234 Custom Dr, Denver CO'}"></div>
  <button class="btn btn-cyan" onclick="saveBusiness()">SAVE SETTINGS</button>
</div>
<div class="settings-group">
  <h4>ACCENT COLOR</h4>
  <div class="color-options">
    <div class="color-opt active" style="background:#00f0ff" onclick="setAccent('#00f0ff')"></div>
    <div class="color-opt" style="background:#ff2d7b" onclick="setAccent('#ff2d7b')"></div>
    <div class="color-opt" style="background:#00ff88" onclick="setAccent('#00ff88')"></div>
    <div class="color-opt" style="background:#ff8800" onclick="setAccent('#ff8800')"></div>
    <div class="color-opt" style="background:#b366ff" onclick="setAccent('#b366ff')"></div>
  </div>
</div>
<div class="settings-group">
  <h4>DATA MANAGEMENT</h4>
  <div style="display:flex;gap:10px;flex-wrap:wrap">
    <button class="btn btn-cyan btn-sm" onclick="exportData()">EXPORT DATA</button>
    <button class="btn btn-green btn-sm" onclick="importData()">IMPORT DATA</button>
    <button class="btn btn-magenta btn-sm" onclick="clearData()">CLEAR ALL DATA</button>
  </div>
</div>`;
}

function saveBusiness(){
const biz={name:document.getElementById('sBizName').value,phone:document.getElementById('sBizPhone').value,
email:document.getElementById('sBizEmail').value,address:document.getElementById('sBizAddr').value};
localStorage.setItem('az_business',JSON.stringify(biz));
alert('Settings saved!');
}

function setAccent(color){
document.documentElement.style.setProperty('--cyan',color);
document.querySelectorAll('.color-opt').forEach(el=>{el.classList.toggle('active',el.style.background===color);});
localStorage.setItem('az_accent',color);
}

function exportData(){
const data=JSON.stringify({leads,appointments,chatHistory,business:JSON.parse(localStorage.getItem('az_business')||'{}')},null,2);
const blob=new Blob([data],{type:'application/json'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spartaauto360-backup.json';a.click();
}

function importData(){
const input=document.createElement('input');input.type='file';input.accept='.json';
input.onchange=e=>{const reader=new FileReader();reader.onload=ev=>{
try{const data=JSON.parse(ev.target.result);
if(data.leads)leads=data.leads;if(data.appointments)appointments=data.appointments;
if(data.chatHistory)chatHistory=data.chatHistory;
if(data.business)localStorage.setItem('az_business',JSON.stringify(data.business));
saveData();renderContent();alert('Data imported!');}catch(err){alert('Invalid file');}};
reader.readAsText(e.target.files[0]);};input.click();
}

function clearData(){
if(confirm('Clear ALL data? This cannot be undone.')){
leads=[...DEFAULT_LEADS];appointments=[...DEFAULT_APPTS];chatHistory=[];
saveData();localStorage.removeItem('az_business');renderContent();alert('Data reset to defaults.');}}

// ===== INIT =====
const savedAccent=localStorage.getItem('az_accent');
if(savedAccent)document.documentElement.style.setProperty('--cyan',savedAccent);
renderNav();
renderContent();
</script>
</body>
</html>
