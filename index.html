<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SPARTAAUTO360 | Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg-deep:#050810;--bg-mid:#0a0e1a;--bg-card:#0d1424;--cyan:#00f0ff;--magenta:#ff2d7b;--green:#00ff88;--amber:#ff8800;--text-bright:#e0f4ff;--text-dim:#7a9cb8;--text-muted:#3a5068;--grid:rgba(0,240,255,0.05)}
@property --num{syntax:"<integer>";initial-value:0;inherits:false}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:var(--bg-deep);color:var(--text-bright);min-height:100vh;overflow-x:hidden;position:relative;padding-top:64px;padding-bottom:80px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms!important;animation-iteration-count:1!important;transition-duration:0.01ms!important}}

.grid-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.grid-bg::before{content:'';position:absolute;inset:-50%;width:200%;height:200%;background:repeating-linear-gradient(90deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 80px),repeating-linear-gradient(0deg,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 80px);transform:perspective(500px) rotateX(60deg);transform-origin:center top;animation:gridPulse 4s ease-in-out infinite}
@keyframes gridPulse{0%,100%{opacity:.4}50%{opacity:.7}}
.scanlines{position:fixed;inset:0;z-index:9998;pointer-events:none;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,240,255,0.015) 2px,rgba(0,240,255,0.015) 4px);animation:scanDrift 8s linear infinite}
@keyframes scanDrift{0%{transform:translateY(0)}100%{transform:translateY(4px)}}
.particles{position:fixed;inset:0;z-index:1;pointer-events:none}
.particles::before{content:'';position:absolute;width:2px;height:2px;border-radius:50%;box-shadow:100px 50px 0 0 rgba(0,240,255,0.4),300px 150px 0 0 rgba(255,45,123,0.3),500px 80px 0 0 rgba(0,255,136,0.3),700px 200px 0 0 rgba(0,240,255,0.2),150px 300px 0 0 rgba(255,136,0,0.3),900px 100px 0 0 rgba(0,240,255,0.4),250px 400px 0 0 rgba(255,45,123,0.2),600px 350px 0 0 rgba(0,255,136,0.4),800px 400px 0 0 rgba(0,240,255,0.3),400px 250px 0 0 rgba(255,136,0,0.2),50px 200px 0 0 rgba(0,240,255,0.5),750px 300px 0 0 rgba(255,45,123,0.4),1000px 150px 0 0 rgba(0,255,136,0.3),1100px 350px 0 0 rgba(0,240,255,0.2),200px 500px 0 0 rgba(255,136,0,0.4);animation:particleFloat 20s linear infinite}
@keyframes particleFloat{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-20px) translateX(10px)}100%{transform:translateY(0) translateX(0)}}

.top-bar{position:fixed;top:0;left:0;right:0;height:60px;z-index:100;background:linear-gradient(180deg,rgba(10,14,26,0.98),rgba(10,14,26,0.9));border-bottom:1px solid rgba(0,240,255,0.2);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-shadow:0 2px 20px rgba(0,240,255,0.08)}
.logo-area{display:flex;align-items:center;gap:12px}
.hex-logo{width:36px;height:36px;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);background:linear-gradient(135deg,var(--cyan),var(--magenta));font-family:'Orbitron',monospace;font-weight:900;font-size:16px;color:#fff}
.brand{display:flex;flex-direction:column}.brand-name{font-family:'Orbitron',monospace;font-size:14px;font-weight:700;color:var(--cyan);text-shadow:0 0 10px rgba(0,240,255,0.5);letter-spacing:2px}.brand-sub{font-size:10px;color:var(--text-muted);letter-spacing:3px;text-transform:uppercase}
.status-area{display:flex;align-items:center;gap:16px}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(0.85)}}
.clock{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-dim)}.clock-date{font-size:10px;color:var(--text-muted);text-align:right}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:70px;z-index:100;background:linear-gradient(0deg,rgba(5,8,16,0.98),rgba(10,14,26,0.95));border-top:1px solid rgba(0,240,255,0.2);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;gap:4px;padding:0 10px;box-shadow:0 -2px 20px rgba(0,240,255,0.08)}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 14px;border:none;background:transparent;color:var(--text-muted);cursor:pointer;border-radius:8px;transition:all .3s;position:relative;font-size:10px;font-family:'Inter',sans-serif}
.nav-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
.nav-btn.active{color:var(--cyan)}.nav-btn.active::after{content:'';position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);border-radius:2px}
.nav-btn:hover{color:var(--text-bright);background:rgba(0,240,255,0.05)}

.hud-card{position:relative;background:rgba(13,20,36,0.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(0,240,255,0.15);padding:20px;margin-bottom:16px;transition:transform .3s,box-shadow .3s;box-shadow:0 4px 24px rgba(0,0,0,0.4),inset 0 1px 0 rgba(0,240,255,0.1)}
.hud-card:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(0,240,255,0.15),inset 0 1px 0 rgba(0,240,255,0.2),0 0 20px rgba(0,240,255,0.05)}
.hud-card::before,.hud-card::after{content:'';position:absolute;width:16px;height:16px;border-color:var(--cyan);border-style:solid;filter:drop-shadow(0 0 4px var(--cyan))}
.hud-card::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.hud-card::after{top:-1px;right:-1px;border-width:2px 2px 0 0}
.card-title{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;color:var(--text-muted);margin-bottom:12px;text-transform:uppercase}
.corner-bl{position:absolute;bottom:-1px;left:-1px;width:16px;height:16px;border-style:solid;border-color:var(--cyan);border-width:0 0 2px 2px;filter:drop-shadow(0 0 4px var(--cyan))}
.corner-br{position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-style:solid;border-color:var(--cyan);border-width:0 2px 2px 0;filter:drop-shadow(0 0 4px var(--cyan))}

/* ANIMATED ROBOT */
.robot-container{display:flex;justify-content:center;align-items:center;padding:30px 0;position:relative}
.robot-glow{position:absolute;width:200px;height:200px;background:radial-gradient(circle,rgba(0,240,255,0.15) 0%,transparent 70%);border-radius:50%;animation:robotGlow 3s ease-in-out infinite}
@keyframes robotGlow{0%,100%{transform:scale(1);opacity:0.5}50%{transform:scale(1.2);opacity:0.8}}
.robot-svg{position:relative;z-index:1;filter:drop-shadow(0 0 20px rgba(0,240,255,0.3)) drop-shadow(0 8px 16px rgba(0,0,0,0.5));animation:robotFloat 4s ease-in-out infinite}
@keyframes robotFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.robot-svg .joint{animation:jointPulse 2s ease-in-out infinite}
@keyframes jointPulse{0%,100%{opacity:0.8}50%{opacity:1}}
.robot-svg .eye{animation:eyeBlink 4s ease-in-out infinite}
@keyframes eyeBlink{0%,45%,55%,100%{r:5}50%{r:2}}
.robot-arm-right{animation:armWave 3s ease-in-out infinite;transform-origin:132px 100px}
@keyframes armWave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-12deg)}75%{transform:rotate(8deg)}}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.kpi-value{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--text-bright)}
.kpi-label{font-size:11px;color:var(--text-muted);margin-top:4px;letter-spacing:1px}
.kpi-change{display:inline-flex;align-items:center;gap:4px;font-size:11px;margin-top:6px;padding:2px 8px;border-radius:4px}
.kpi-change.up{color:var(--green);background:rgba(0,255,136,0.1)}.kpi-change.down{color:var(--magenta);background:rgba(255,45,123,0.1)}
.chart-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:24px}
.bar-chart{display:flex;align-items:flex-end;justify-content:space-around;height:160px;padding-top:20px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.bar{width:24px;border-radius:4px 4px 0 0;background:linear-gradient(0deg,var(--cyan),rgba(0,240,255,0.4));box-shadow:0 0 15px rgba(0,240,255,0.4),0 0 30px rgba(0,240,255,0.15),inset 0 0 10px rgba(0,240,255,0.2);transition:height 1.5s cubic-bezier(0.4,0,0.2,1);position:relative}
.bar::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);width:20px;height:6px;background:rgba(0,240,255,0.3);filter:blur(4px);border-radius:50%}
.bar-label{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}
.line-path{fill:none;stroke:var(--cyan);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1000;stroke-dashoffset:1000;animation:drawLine 2s ease forwards 0.5s}
@keyframes drawLine{to{stroke-dashoffset:0}}
.line-area{opacity:0;animation:fadeIn 1s ease forwards 2s}@keyframes fadeIn{to{opacity:1}}
.donut-ring{fill:none;stroke-width:8;stroke-linecap:round}
.flow-container{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 0}
.flow-node{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 16px;border:1px solid rgba(0,240,255,0.3);background:rgba(0,240,255,0.05);border-radius:4px;min-width:70px}
.flow-node-label{font-size:10px;color:var(--text-dim);font-family:'Orbitron',monospace;letter-spacing:1px}
.flow-node-value{font-family:'JetBrains Mono',monospace;font-size:18px;font-weight:700;color:var(--cyan)}
.flow-arrow{width:30px;height:2px;background:linear-gradient(90deg,var(--cyan),transparent);position:relative;animation:flowPulse 2s ease-in-out infinite}
.flow-arrow::after{content:'';position:absolute;right:0;top:-3px;border:4px solid transparent;border-left:6px solid var(--cyan)}
@keyframes flowPulse{0%,100%{opacity:.4}50%{opacity:1}}
.ring-progress{position:relative;width:44px;height:44px}.ring-progress svg{transform:rotate(-90deg)}
.ring-progress circle{fill:none;stroke-width:3}.ring-bg{stroke:rgba(0,240,255,0.1)}.ring-fill{stroke:var(--cyan);stroke-linecap:round;transition:stroke-dashoffset 1.5s ease}

.hud-table{width:100%;border-collapse:collapse;font-size:13px}
.hud-table th{font-family:'Orbitron',monospace;font-size:10px;letter-spacing:1px;color:var(--text-muted);text-align:left;padding:10px 12px;border-bottom:1px solid rgba(0,240,255,0.1)}
.hud-table td{padding:10px 12px;border-bottom:1px solid rgba(0,240,255,0.05);color:var(--text-dim)}
.hud-table tr:hover td{background:rgba(0,240,255,0.03);color:var(--text-bright)}
.status-chip{display:inline-block;padding:3px 10px;border-radius:4px;font-size:10px;font-weight:600;letter-spacing:0.5px}
.status-new{background:rgba(0,240,255,0.15);color:var(--cyan);border:1px solid rgba(0,240,255,0.3)}
.status-contacted{background:rgba(255,136,0,0.15);color:var(--amber);border:1px solid rgba(255,136,0,0.3)}
.status-won{background:rgba(0,255,136,0.15);color:var(--green);border:1px solid rgba(0,255,136,0.3)}
.status-lost{background:rgba(255,45,123,0.15);color:var(--magenta);border:1px solid rgba(255,45,123,0.3)}
.status-quoted{background:rgba(138,43,226,0.15);color:#b366ff;border:1px solid rgba(138,43,226,0.3)}
.status-booked{background:rgba(0,200,255,0.2);color:#66ddff;border:1px solid rgba(0,200,255,0.4)}

.modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(5,8,16,0.85);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--bg-mid);border:1px solid rgba(0,240,255,0.2);padding:28px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;position:relative}
.modal::before,.modal::after{content:'';position:absolute;width:16px;height:16px;border-color:var(--cyan);border-style:solid}
.modal::before{top:-1px;left:-1px;border-width:2px 0 0 2px}.modal::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.modal h3{font-family:'Orbitron',monospace;font-size:14px;color:var(--cyan);margin-bottom:20px;letter-spacing:2px}
.form-group{margin-bottom:14px}.form-group label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:4px;letter-spacing:1px;font-family:'Orbitron',monospace}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;background:rgba(0,240,255,0.03);border:1px solid rgba(0,240,255,0.15);color:var(--text-bright);font-family:'Inter',sans-serif;font-size:13px;border-radius:4px;outline:none;transition:border-color .3s}
.form-group input:focus,.form-group select:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,0.2)}
.btn{padding:10px 20px;border:1px solid;border-radius:4px;cursor:pointer;font-family:'Orbitron',monospace;font-size:11px;letter-spacing:1px;transition:all .3s;background:transparent}
.btn-cyan{border-color:var(--cyan);color:var(--cyan)}.btn-cyan:hover{background:rgba(0,240,255,0.15);box-shadow:0 0 15px rgba(0,240,255,0.3)}
.btn-magenta{border-color:var(--magenta);color:var(--magenta)}.btn-magenta:hover{background:rgba(255,45,123,0.15)}
.btn-green{border-color:var(--green);color:var(--green)}.btn-green:hover{background:rgba(0,255,136,0.15)}
.btn-sm{padding:6px 12px;font-size:10px}
.feed-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid rgba(0,240,255,0.05)}
.feed-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.feed-text{font-size:12px;color:var(--text-dim)}.feed-time{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.chat-container{display:flex;flex-direction:column;height:400px}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.chat-bubble{max-width:80%;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.5}
.chat-bubble.ai{background:rgba(0,240,255,0.08);border:1px solid rgba(0,240,255,0.15);align-self:flex-start;color:var(--text-dim)}
.chat-bubble.user{background:rgba(255,45,123,0.08);border:1px solid rgba(255,45,123,0.15);align-self:flex-end;color:var(--text-dim)}
.chat-input-area{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(0,240,255,0.1)}
.chat-input-area input{flex:1;padding:10px;background:rgba(0,240,255,0.03);border:1px solid rgba(0,240,255,0.15);color:var(--text-bright);border-radius:4px;font-size:13px;outline:none}
.schedule-item{display:flex;gap:16px;padding:14px;margin-bottom:10px;border:1px solid rgba(0,240,255,0.08);background:rgba(0,240,255,0.02)}
.schedule-time{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cyan);min-width:60px}
.schedule-info{flex:1}.schedule-info h4{font-size:13px;color:var(--text-bright);margin-bottom:4px}.schedule-info p{font-size:11px;color:var(--text-muted)}
.content-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.content-card{border:1px solid rgba(0,240,255,0.08);padding:16px;background:rgba(0,240,255,0.02)}
.content-card h4{font-size:13px;margin-bottom:8px;color:var(--text-bright)}.content-card p{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:10px}
.platform-tag{display:inline-block;padding:2px 8px;border-radius:3px;font-size:9px;font-weight:600;margin-right:4px}
.settings-group{margin-bottom:24px;padding:20px;border:1px solid rgba(0,240,255,0.08);background:rgba(0,240,255,0.02)}
.settings-group h4{font-family:'Orbitron',monospace;font-size:12px;color:var(--cyan);margin-bottom:16px;letter-spacing:1px}
.color-options{display:flex;gap:10px;margin-top:8px}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .3s}
.color-opt.active,.color-opt:hover{border-color:#fff;transform:scale(1.1)}
.search-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{flex:1;min-width:200px;padding:10px 14px;background:rgba(0,240,255,0.03);border:1px solid rgba(0,240,255,0.12);color:var(--text-bright);border-radius:4px;font-size:13px;outline:none}
.search-bar input:focus{border-color:var(--cyan)}
.search-bar select{padding:10px;background:var(--bg-card);border:1px solid rgba(0,240,255,0.12);color:var(--text-dim);border-radius:4px;font-size:12px;outline:none}
.toggle-group{display:flex;gap:8px;margin-bottom:16px}.toggle-btn{padding:8px 16px;border:1px solid rgba(0,240,255,0.2);background:transparent;color:var(--text-dim);font-size:12px;cursor:pointer;border-radius:4px;transition:all .3s}
.toggle-btn.active{background:rgba(0,240,255,0.15);color:var(--cyan);border-color:var(--cyan)}
.quick-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.quick-action{padding:8px 14px;border:1px solid rgba(0,240,255,0.2);border-radius:20px;font-size:11px;color:var(--text-dim);cursor:pointer;transition:all .3s}
.quick-action:hover{border-color:var(--cyan);color:var(--cyan);background:rgba(0,240,255,0.05)}
.sparkline{display:flex;align-items:flex-end;gap:2px;height:30px}.sparkline .spark-bar{width:4px;border-radius:2px;background:var(--cyan);opacity:.6;animation:sparkRise 1s ease forwards}
@keyframes sparkRise{from{height:0}}
.voice-metric{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid rgba(0,240,255,0.06);margin-bottom:8px}
.voice-metric .vm-label{font-size:11px;color:var(--text-muted);flex:1}.voice-metric .vm-value{font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--text-bright)}
@media(max-width:768px){.kpi-grid{grid-template-columns:1fr 1fr}.chart-grid{grid-template-columns:1fr}.flow-container{flex-direction:column}.hud-table{font-size:11px}.nav-btn{padding:8px 8px;font-size:9px}.top-bar{padding:0 12px}.brand-name{font-size:11px}}
@media(max-width:480px){.kpi-grid{grid-template-columns:1fr}.nav-btn span{display:none}}

/* CANDLESTICK CHART */
.candlestick-chart{display:flex;align-items:center;justify-content:space-around;height:180px;padding:10px 0;position:relative}
.candlestick-chart::before{content:'';position:absolute;bottom:20px;left:0;right:0;height:1px;background:rgba(0,240,255,0.1)}
.candle{display:flex;flex-direction:column;align-items:center;position:relative;height:100%}
.candle-wick{width:1.5px;background:rgba(255,255,255,0.3);position:absolute}
.candle-body{width:14px;border-radius:2px;position:absolute;min-height:4px;box-shadow:0 0 8px currentColor;transition:all 1s ease}
.candle-body.bull{background:linear-gradient(180deg,var(--green),rgba(0,255,136,0.6));color:var(--green)}
.candle-body.bear{background:linear-gradient(180deg,var(--magenta),rgba(255,45,123,0.6));color:var(--magenta)}

/* WAVEFORM */
.waveform-container{height:80px;position:relative;overflow:hidden;border-radius:4px;background:rgba(0,240,255,0.02);border:1px solid rgba(0,240,255,0.08)}
.waveform-canvas{width:100%;height:100%;display:block}

/* CIRCULAR GAUGES */
.gauge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:16px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:8px}
.gauge-ring{position:relative;width:90px;height:90px}
.gauge-ring svg{transform:rotate(-90deg)}
.gauge-ring circle{fill:none;stroke-linecap:round;transition:stroke-dashoffset 2s cubic-bezier(0.4,0,0.2,1)}
.gauge-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--text-bright)}
.gauge-label{font-size:10px;color:var(--text-muted);font-family:'Orbitron',monospace;letter-spacing:1px;text-align:center}

/* SCROLLING DATA PANELS */
.scroll-panel{overflow:hidden;height:28px;position:relative}
.scroll-panel-inner{animation:scrollUp 10s linear infinite}
@keyframes scrollUp{0%{transform:translateY(0)}100%{transform:translateY(-50%)}}
.scroll-item{height:28px;display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)}
.scroll-item .ticker{color:var(--cyan);font-weight:600;min-width:50px}
.scroll-item .value{color:var(--text-bright)}
.scroll-item .change-up{color:var(--green)}
.scroll-item .change-down{color:var(--magenta)}

/* LIVE TICKER BAR */
.ticker-bar{overflow:hidden;height:32px;background:rgba(0,240,255,0.03);border:1px solid rgba(0,240,255,0.08);margin-bottom:16px;display:flex;align-items:center}
.ticker-track{display:flex;animation:tickerScroll 30s linear infinite;white-space:nowrap}
@keyframes tickerScroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 24px;font-family:'JetBrains Mono',monospace;font-size:11px}
.ticker-item .t-symbol{color:var(--cyan);font-weight:600}
.ticker-item .t-up{color:var(--green)}
.ticker-item .t-down{color:var(--magenta)}

/* 3D ROBOT ENHANCED */
.robot-container{display:flex;justify-content:center;align-items:center;padding:20px 0;position:relative}
.robot-glow{position:absolute;width:250px;height:250px;background:radial-gradient(circle,rgba(0,240,255,0.12) 0%,rgba(123,47,255,0.05) 40%,transparent 70%);border-radius:50%;animation:robotGlow 3s ease-in-out infinite}
.robot-floor{position:absolute;bottom:10px;width:120px;height:20px;background:radial-gradient(ellipse,rgba(0,240,255,0.2) 0%,transparent 70%);border-radius:50%;animation:floorPulse 3s ease-in-out infinite}
@keyframes floorPulse{0%,100%{transform:scaleX(1);opacity:0.6}50%{transform:scaleX(1.3);opacity:0.3}}
</style>

      </tr>`).join('')}

function filterLeads(){
const q=document.getElementById('leadSearch').value.toLowerCase();
const f=document.getElementById('leadFilter').value;
const rows=document.getElementById('leadsTableBody').querySelectorAll('tr');
leads.forEach((l,i)=>{
const matchQ=l.name.toLowerCase().includes(q)||l.service.toLowerCase().includes(q)||l.vehicle.toLowerCase().includes(q);
const matchF=!f||l.status===f;
if(rows[i])rows[i].style.display=(matchQ&&matchF)?'':'none';
});
}

function saveLead(id){
const data={
name:document.getElementById('mName').value,
contact:document.getElementById('mContact').value,
service:document.getElementById('mService').value,
value:parseInt(document.getElementById('mValue').value)||0,
vehicle:document.getElementById('mVehicle').value,
status:document.getElementById('mStatus').value,
date:new Date().toISOString().split('T')[0]
};
if(!data.name){alert('Name required');return;}
if(id){const idx=leads.findIndex(l=>l.id===id);if(idx>-1){leads[idx]={...leads[idx],...data};}}
else{data.id=Date.now();leads.unshift(data);}
saveData();closeModal();renderContent();
}

function deleteLead(id){if(confirm('Delete this lead?')){leads=leads.filter(l=>l.id!==id);saveData();renderContent();}}

// ===== SCHEDULE TAB =====
function renderSchedule(){
const today=new Date().toISOString().split('T')[0];
const sortedAppts=[...appointments].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time));
const grouped={};
sortedAppts.forEach(a=>{if(!grouped[a.date])grouped[a.date]=[];grouped[a.date].push(a);});

return `
<div class="hud-card"><div class="corner-bl"></div><div class="corner-br"></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px">
    <div class="card-title" style="margin:0">Appointments</div>
    <button class="btn btn-cyan btn-sm" onclick="openApptModal()">+ NEW APPOINTMENT</button>
  </div>
  ${Object.entries(grouped).map(([date,appts])=>{
    const d=new Date(date+'T12:00:00');const isToday=date===today;
    const dateLabel=isToday?'TODAY':d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
    return `<div style="margin-bottom:20px">
      <div style="font-family:'Orbitron',monospace;font-size:11px;color:${isToday?'var(--cyan)':'var(--text-muted)'};margin-bottom:10px;letter-spacing:2px;${isToday?'text-shadow:0 0 10px rgba(0,240,255,0.5)':''}">${dateLabel}</div>
      ${appts.map(a=>`<div class="schedule-item">
        <div class="schedule-time">${a.time}</div>
        <div class="schedule-info"><h4>${a.client}</h4><p>${a.service} &bull; ${a.vehicle} &bull; ${a.duration}</p></div>
        <div><button class="btn btn-cyan btn-sm" onclick="openApptModal(${a.id})" style="margin-right:4px">Edit</button><button class="btn btn-magenta btn-sm" onclick="deleteAppt(${a.id})">Del</button></div>
      </div>`).join('')}
    </div>`;
  }).join('')}
  ${Object.keys(grouped).length===0?'<p style="color:var(--text-muted);text-align:center;padding:40px">No appointments scheduled</p>':''}
</div>`;
}

function sendChat(){
const input=document.getElementById('chatInput');
const text=input.value.trim();if(!text)return;
chatHistory.push({role:'user',text});
input.value='';
// AI response
const response=generateAIResponse(text);
chatHistory.push({role:'ai',text:response});
saveData();
const msgs=document.getElementById('chatMessages');
msgs.innerHTML+=`<div class="chat-bubble user">${text}</div><div class="chat-bubble ai">${response}</div>`;
msgs.scrollTop=msgs.scrollHeight;
}

function aiQuick(type){
const queries={
summary:`Here's your daily summary:\n- ${leads.filter(l=>l.status==='new').length} new leads pending\n- ${appointments.length} appointments scheduled\n- $${leads.filter(l=>l.status==='won').reduce((s,l)=>s+l.value,0).toLocaleString()} total revenue from won deals\n- Top service: ${getMostPopularService()}`,
followups:`Follow-up needed:\n${leads.filter(l=>l.status==='contacted').map(l=>'- '+l.name+' ('+l.service+')').join('\n')||'No pending follow-ups!'}`,
revenue:`Revenue breakdown:\n- Won deals: $${leads.filter(l=>l.status==='won').reduce((s,l)=>s+l.value,0).toLocaleString()}\n- Pipeline value: $${leads.filter(l=>l.status!=='won'&&l.status!=='lost').reduce((s,l)=>s+l.value,0).toLocaleString()}\n- Avg deal size: $${Math.round(leads.reduce((s,l)=>s+l.value,0)/leads.length).toLocaleString()}`,
schedule:`Upcoming appointments:\n${appointments.sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3).map(a=>'- '+a.date+' '+a.time+': '+a.client+' ('+a.service+')').join('\n')||'No appointments scheduled'}`
};
chatHistory.push({role:'ai',text:queries[type]});
saveData();renderContent();
setTimeout(()=>{const msgs=document.getElementById('chatMessages');if(msgs)msgs.scrollTop=msgs.scrollHeight;},100);
}

function generateAIResponse(text){
const lower=text.toLowerCase();
if(lower.includes('lead')||lower.includes('new'))return `You currently have ${leads.filter(l=>l.status==='new').length} new leads waiting for contact. The highest value is ${leads.sort((a,b)=>b.value-a.value)[0]?.name} at $${leads.sort((a,b)=>b.value-a.value)[0]?.value.toLocaleString()}.`;
if(lower.includes('revenue')||lower.includes('money')||lower.includes('sales'))return `Total revenue from won deals: $${leads.filter(l=>l.status==='won').reduce((s,l)=>s+l.value,0).toLocaleString()}. Your pipeline has $${leads.filter(l=>l.status!=='won'&&l.status!=='lost').reduce((s,l)=>s+l.value,0).toLocaleString()} in potential revenue.`;
if(lower.includes('schedule')||lower.includes('appointment'))return `You have ${appointments.length} appointments coming up. Next one: ${appointments[0]?.client||'None'} - ${appointments[0]?.service||'N/A'}.`;
if(lower.includes('service')||lower.includes('popular'))return `Most requested service: ${getMostPopularService()}. PPF and wraps generate the highest revenue per job.`;
return `I can help you with lead management, scheduling, revenue reports, and business insights. Try asking about your leads, revenue, or upcoming appointments!`;
}

function getMostPopularService(){
const counts={};leads.forEach(l=>{counts[l.service]=(counts[l.service]||0)+1;});
return Object.entries(counts).sort((a,b)=>b[1]-a[1])[0]?.[0]||'N/A';
}

  const osc=audioCtx.createOscillator();const gain=audioCtx.createGain();

  osc.type='sine';osc.frequency.setValueAtTime(1200,audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(600,audioCtx.currentTime+0.08);
  gain.gain.setValueAtTime(0.15,audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.1);
  osc.start();osc.stop(audioCtx.currentTime+0.1);
}

// ===== WAVEFORM CANVAS ANIMATION =====
let waveAnimId=null;
function startWaveform(){
  const canvas=document.getElementById('waveformCanvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth*2;canvas.height=canvas.offsetHeight*2;
  ctx.scale(2,2);
  const w=canvas.offsetWidth,h=canvas.offsetHeight;
  let phase=0;
  function drawWave(){
    ctx.clearRect(0,0,w,h);
    // Draw multiple wave layers
    const waves=[
      {amp:h*0.25,freq:0.02,speed:0.05,color:'rgba(0,240,255,0.6)',width:2},
      {amp:h*0.18,freq:0.03,speed:0.03,color:'rgba(0,240,255,0.3)',width:1.5},
      {amp:h*0.12,freq:0.05,speed:0.07,color:'rgba(123,47,255,0.3)',width:1},
      {amp:h*0.08,freq:0.04,speed:0.04,color:'rgba(0,255,136,0.2)',width:1}
    ];
    waves.forEach(wave=>{
      ctx.beginPath();ctx.strokeStyle=wave.color;ctx.lineWidth=wave.width;
      for(let x=0;x<w;x++){
        const y=h/2+Math.sin(x*wave.freq+phase*wave.speed)*wave.amp*Math.sin(x*0.005+phase*0.02);
        if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    });
    // Glow center line
    ctx.beginPath();ctx.strokeStyle='rgba(0,240,255,0.1)';ctx.lineWidth=1;
    ctx.moveTo(0,h/2);ctx.lineTo(w,h/2);ctx.stroke();
    phase++;
    waveAnimId=requestAnimationFrame(drawWave);
  }
  drawWave();
}

// ===== CANDLESTICK CHART =====
function renderCandlestick(){
  const container=document.getElementById('candlestickChart');
  if(!container)return;
  // Generate random candlestick data (12 candles)
  const candles=[];
  let price=100;
  for(let i=0;i<12;i++){
    const open=price;
    const close=open+(Math.random()-0.45)*20;
    const high=Math.max(open,close)+(Math.random()*10);
    const low=Math.min(open,close)-(Math.random()*10);
    candles.push({open,close,high,low,bull:close>open});
    price=close;
  }
  const allPrices=candles.flatMap(c=>[c.high,c.low]);
  const maxP=Math.max(...allPrices),minP=Math.min(...allPrices);
  const range=maxP-minP||1;
  const chartH=150;
  function priceToY(p){return chartH-((p-minP)/range)*chartH+10;}
  
  container.innerHTML=candles.map((c,i)=>{
    const bodyTop=priceToY(Math.max(c.open,c.close));
    const bodyBot=priceToY(Math.min(c.open,c.close));
    const bodyH=Math.max(bodyBot-bodyTop,4);
    const wickTop=priceToY(c.high);
    const wickBot=priceToY(c.low);
    return `<div class="candle" style="width:${100/12}%;height:${chartH+20}px">
      <div class="candle-wick" style="top:${wickTop}px;height:${wickBot-wickTop}px"></div>
      <div class="candle-body ${c.bull?'bull':'bear'}" style="top:${bodyTop}px;height:${bodyH}px;animation-delay:${i*0.1}s"></div>
    </div>`;
  }).join('');
}
